name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; queued runs wait, they are never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Middleware (proxy.ts), the auth callback, and the AI flashcard Server
      # Action all require a Node.js server — remove/stub them for static export.
      - name: Remove server-only features
        run: |
          rm -f src/proxy.ts
          rm -rf src/app/auth
          cat > src/app/flashcards/actions.ts << 'EOF'
          export async function generateFlashcards(
            _text: string
          ): Promise<{ question: string; answer: string }[]> {
            throw new Error(
              "AI generation is only available on the Vercel deployment."
            );
          }
          EOF

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # GitHub Pages uses Jekyll, which ignores _next/. The .nojekyll file
      # disables Jekyll so the _next/ static assets are served correctly.
      - name: Disable Jekyll
        run: mkdir -p out && touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
